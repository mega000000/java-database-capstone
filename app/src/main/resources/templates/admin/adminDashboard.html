<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Smart Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/adminDashboard.css}">
</head>
<body>
    <div id="header-container"></div>
    <div class="dashboard-container">
        <h1>Admin Dashboard</h1>
        
        <div class="controls">
            <input type="text" id="searchDoctor" placeholder="Search doctor by name...">
            <input type="text" id="filterSpecialty" placeholder="Filter by specialty...">
            <button id="addDoctorBtn">Add Doctor</button>
        </div>

        <div id="doctor-list" class="grid-container">
            <!-- Doctor cards will be injected here -->
        </div>
    </div>
    
    <div id="modal-container"></div>

    <script th:src="@{/js/index.js}"></script>
    <script th:src="@{/js/doctorService.js}"></script>
    <script th:src="@{/js/doctorCard.js}"></script>
    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/adminDashboard.js}"></script>
</body>
</html>
